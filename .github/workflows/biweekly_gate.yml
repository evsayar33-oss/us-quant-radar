name: US Quant Radar Biweekly Gate

on:
  schedule:
    - cron: '0 22 * * 1' # Her Pazartesi 22:00 UTC (Haftalık kontrol)
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Biweekly Update
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
          FINRA_TOKEN_URL: ${{ secrets.FINRA_TOKEN_URL }}
        run: python main_biweekly.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "QuantBot-Structural"
          git config --global user.email "bot@github.com"
          git add yapisal_gate.csv
          git commit -m "Auto: Structural Gate Updated" || echo "No changes"
          git push
